[project]
name = "attendance"
version = "0.1.0"
description = "An app for calculating, forecasting, and planning your attendance."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.5.1",
    "pandas==3.0.5",
    "pyqt6==6.11.0",
    "requests==2.34.2",
    "scikit-learn==1.9.0",
]

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "ruff>=0.16.1",
]


# ------- Ruff (Linting & Formatting) -------
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "ANN",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "N",
    "SIM",
    "UP",
    "W"
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "ANN"]

[tool.ruff.format]
docstring-code-format = true


# ------- Pytest -------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.pyrefly]
search-path = ["."]
python-version = "3.12.0"
preset = "strict"

[tool.pyrefly.errors]
redundant-cast = "warn"
